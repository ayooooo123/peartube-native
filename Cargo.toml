[package]
name = "peartube-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "PearTube native backend: channel protocol and mnemonic identity"
keywords = ["peartube", "hypercore", "p2p", "protocol"]
categories = ["cryptography", "network-programming"]

[lib]
name = "peartube_native"

[dependencies]
compact-encoding-rs = { path = "../compact-encoding-rs" }
hypercore-rs = { path = "../hypercore-rs" }
hyperblobs-rs = { path = "../hyperblobs-rs" }
corestore-rs = { path = "../corestore-rs" }
hyperbee-rs = { path = "../hyperbee-rs" }
autobee-rs = { path = "../autobee-rs" }
peeroxide = { path = "../peeroxide/peeroxide" }
libudx = { path = "../peeroxide/libudx" }
byte-stream-rs = { path = "../byte-stream-rs" }
# Our branch `peartube` of mdns-sd 0.21.7: evicts expired SRV/TXT records no PTR points at.
mdns-sd = { path = "../mdns-sd" }
simple-dns = "0.13"
socket2 = { version = "0.6", features = ["all"] }
mio = { version = "1", features = ["net", "os-poll"] }
if-addrs = "0.15"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# `compress`: node/hash_state.rs keeps libsodium's exportable state and borrows the rounds.
sha2 = { version = "0.10", features = ["compress"] }
xsalsa20poly1305 = "0.9"
protomux-rs = { path = "../protomux-rs" }
protomux-wakeup-rs = { path = "../protomux-wakeup-rs" }
peeroxide-dht = "1.7.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "process", "sync", "signal"] }
http-body-util = "0.1"
bytes = "1"
futures-channel = "0.3"
futures-util = "0.3"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# The order `localeCompare` gives search hits that tie (providers/soulseek/rank.rs): the CLDR root
# collation. ICU4X's normalizer and properties are here already, through `url`.
icu_collator = "2"
# The letters and digits `albumKey` keeps (`\p{L}`, `\p{N}`) are Unicode general categories. The standard
# library has no test for them: `char::is_alphanumeric` also accepts vowel signs, which are marks.
icu_properties = { version = "2", features = ["compiled_data"] }
# The Soulseek client the app's `peartube-soulseek-bare` addon wraps, at the commit that gates its C ABI behind `c-api`.
peartube-soulseek = { git = "https://github.com/ayooooo123/peartube-soulseek", rev = "81b6975a0398f2e0f3404c6184da0b767efc033c", default-features = false, optional = true }
# The relay's HTTPS listener (hyper-rustls already builds it for the client).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
unicode-normalization = "0.1"
url = "2"
tempfile = "3"
ubit = { git = "https://github.com/ayooooo123/ubit", rev = "a243219e3b98387e80526122a28f91b0b533be10" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

# sha2 0.10 uses the CPU's SHA-256 instructions on aarch64 only with `asm` (x86-64 finds SHA-NI
# by itself); without it a publish or a copy check hashes the whole file in portable code.
# It checks for the instructions at run time: a Raspberry Pi 4 has none and keeps the portable code.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[build-dependencies]
hyperschema-rs = { path = "../hyperschema-rs" }

[dev-dependencies]
# A reference holds the app's numbers with every digit: read them exactly (the default parser may be
# one unit in the last place off on a 17-digit number, as it was on a FLAC duration).
serde_json = { version = "1", features = ["float_roundtrip"] }
# The paused clock tests/soulseek_provider.rs runs the provider's watchdog on.
tokio = { version = "1", features = ["test-util"] }

[workspace]
members = ["ffi"]

[workspace.lints.clippy]
todo = "deny"
dbg_macro = "deny"
await_holding_lock = "deny"

[lints]
workspace = true

[features]
default = ["peeroxide-dht", "soulseek"]
peeroxide-dht = []
# The `soulseek` provider reaches the Soulseek network (providers/soulseek/client/network.rs).
# `peartube-soulseek` disables its `c-api` feature (`default-features = false`), so linking it into
# `peartube-native-ffi` exports only the six `pt_*` symbols.
soulseek = ["dep:peartube-soulseek"]

# The apps' engine (ffi/build.sh). App packages store it uncompressed, so its size is download
# size. One codegen unit and fat LTO let LLVM see every crate at once: inline functions and drop
# glue are emitted once instead of once per unit, and unreached code goes before the linker sees it.
# Unwinding stays on: the C ABI answers PT_ERR_PANIC, and a panicking task must not end the app.
# The relay keeps the stock release profile.
[profile.engine]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "z"

# The crates that run once per byte stay at 3. The hashes and the MAC then cost the same as in
# an all-3 build (profile of a 1 GiB transfer, where no other crate reached 2 %); signatures
# were not measured. hypercore-rs is here for its block cipher, which is generic and compiled
# where it is used: XSalsa20 runs at 516 MB/s with this line and 459 MB/s without. The link
# itself runs at "s", so it does not reach the 622 MB/s of an all-3 build.
[profile.engine.package]
sha2.opt-level = 3
blake2b_simd.opt-level = 3
poly1305.opt-level = 3
curve25519-dalek.opt-level = 3
ed25519-dalek.opt-level = 3
hypercore-rs.opt-level = 3

# Our fork: UDX write pipelining, C-compatible pacing and SACKs, reachability check (see ../peeroxide).
[patch.crates-io]
peeroxide = { path = "../peeroxide/peeroxide" }
peeroxide-dht = { path = "../peeroxide/peeroxide-dht" }
libudx = { path = "../peeroxide/libudx" }
