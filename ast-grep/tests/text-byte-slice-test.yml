id: text-byte-slice
valid:
  # The repaired form of the fault from pull request 31: `get` returns `None` for a position inside a character.
  - |
    pub(crate) fn js_number(s: &str) -> f64 {
        let t = js_trim(s);
        if let Some(prefix) = t.get(..2) {
            let radix = match prefix {
                "0x" | "0X" => Some(16),
                "0o" | "0O" => Some(8),
                "0b" | "0B" => Some(2),
                _ => None,
            };
        }
        0.0
    }
  # `strip_prefix` has no index.
  - |
    fn f(t: &str) -> Option<u32> {
        let rest = t.strip_prefix("0x")?;
        u32::from_str_radix(rest, 16).ok()
    }
  # `split_once` has no index.
  - |
    fn f(text: &str) -> Option<(&str, &str)> {
        let (key, value) = text.split_once(':')?;
        Some((key, value))
    }
  # A slice of a byte slice cannot split a character.
  - |
    fn f(buf: &[u8]) -> &[u8] { &buf[..2] }
  # A slice of a byte vector cannot split a character.
  - |
    fn f(bytes: Vec<u8>) { let x = &bytes[1..]; }
  # `let` with a byte-slice type.
  - |
    fn f(x: Foo) { let t: &[u8] = x.head(); let _ = &t[..2]; }
  # The index is on the bytes of the text, not on the text.
  - |
    fn f(t: &str) -> &[u8] { &t.as_bytes()[..2] }
  # The function turns the text into bytes before the index.
  - |
    fn f(text: &str) -> &[u8] {
        let text = text.as_bytes();
        &text[..2]
    }
  # The function turns the text into bytes with a tuple `let`.
  - |
    fn f(text: &str, phrase: &str) -> bool {
        let (text, phrase) = (text.as_bytes(), phrase.as_bytes());
        text[1..].eq_ignore_ascii_case(phrase)
    }
  # An index without a range.
  - |
    fn f(t: &str, v: &[String], i: usize) -> String { v[i].clone() }
  # The full range `..` never panics.
  - |
    fn f(t: &str) -> &str { &t[..] }
  # A list of strings is not text.
  - |
    fn f(args: &[&str], words: Vec<String>) { let _ = (&args[1..], &words[..2]); }
  # The slice is of another value than the text parameter and the text `let`.
  - |
    fn f(name: &str, buf: Foo) {
        let t = name.trim();
        let head = &buf[..2];
    }
  # A `let` with an unknown value does not make the value text.
  - |
    fn f(x: Foo) { let buf = x.to_vec(); let _ = &buf[..2]; }
  # `from_utf8` takes bytes.
  - |
    fn f(buf: &[u8], n: usize) -> bool { std::str::from_utf8(&buf[..n]).is_ok() }
  # `iter` is not a text method.
  - |
    fn f(buf: Foo) -> bool { buf[..2].iter().all(|b| *b == 0) }
  # A `match` on bytes with byte-string patterns.
  - |
    fn f(buf: Foo) -> u8 {
        match &buf[..2] {
            b"0x" => 16,
            _ => 10,
        }
    }
  # A `match` on a slice of strings, with a slice pattern.
  - |
    fn f(words: Foo) {
        match &words[..2] {
            ["add", name] => run(name),
            _ => {}
        }
    }
  # A comparison with a byte string.
  - |
    fn f(buf: Foo) -> bool { &buf[..2] == b"ab" }
  # A comparison with a raw byte string.
  - |
    fn f(buf: Foo) -> bool { &buf[..2] == br"ab" }
invalid:
  # The fault from pull request 31: `t` comes from `js_trim`, and the `match` has string-literal arms.
  - |
    pub(crate) fn js_number(s: &str) -> f64 {
        let t = js_trim(s);
        if t.len() > 2 {
            let radix = match &t[..2] {
                "0x" | "0X" => Some(16),
                "0o" | "0O" => Some(8),
                "0b" | "0B" => Some(2),
                _ => None,
            };
        }
        0.0
    }
  # The hex decoder that six modules copy. The input "a\u{e9}" and 61 zeros is 64 bytes and panics.
  - |
    fn parse_hex32(text: &str) -> Option<[u8; 32]> {
        if text.len() != 64 {
            return None;
        }
        let mut key = [0u8; 32];
        for (index, byte) in key.iter_mut().enumerate() {
            *byte = u8::from_str_radix(&text[index * 2..index * 2 + 2], 16).ok()?;
        }
        Some(key)
    }
  # The hex decoder in a closure.
  - |
    fn unhex(s: &str) -> Vec<u8> {
        (0..s.len()).step_by(2).map(|i| u8::from_str_radix(&s[i..i + 2], 16).unwrap()).collect()
    }
