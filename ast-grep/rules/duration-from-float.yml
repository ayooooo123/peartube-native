id: duration-from-float
language: rust
severity: error
message: This float to Duration conversion panics on a negative, NaN or too large value.
note: |
  Use Duration::try_from_secs_f64(x) (or try_from_secs_f32) instead of this call.
  Those functions return an error for a negative, NaN or too large value. Decide in code what such a value means, for example no wait or Duration::MAX.
  For mul and div methods, pass the new length in seconds, for example d.as_secs_f64() * x, to try_from_secs_f64 or try_from_secs_f32.
  See docs/code-rules.md#duration-from-float.
rule:
  any:
    - pattern: Duration::from_secs_f64($X)
    - pattern: Duration::from_secs_f32($X)
    - pattern: $P::Duration::from_secs_f64($X)
    - pattern: $P::Duration::from_secs_f32($X)
    - pattern: $D.mul_f64($X)
    - pattern: $D.mul_f32($X)
    - pattern: $D.div_f64($X)
    - pattern: $D.div_f32($X)
