id: duration-from-float
language: rust
severity: error
message: This float to Duration conversion panics on a negative, NaN or too large value.
note: |
  Use Duration::try_from_secs_f64(x) (or try_from_secs_f32) instead of this call, and handle its error on purpose.
  Better, where the code reads the setting, reject a value that is not finite, is negative, or makes a wait too long.
  Do not add a fallback such as Duration::MAX to an Instant: Instant + Duration panics on overflow. Use Instant::checked_add.
  For mul and div methods, pass the new length in seconds, for example d.as_secs_f64() * x, to try_from_secs_f64 or try_from_secs_f32.
  See docs/code-rules.md#duration-from-float.
rule:
  any:
    - pattern: Duration::from_secs_f64($X)
    - pattern: Duration::from_secs_f32($X)
    - pattern: $P::Duration::from_secs_f64($X)
    - pattern: $P::Duration::from_secs_f32($X)
    - pattern: $D.mul_f64($X)
    - pattern: $D.mul_f32($X)
    - pattern: $D.div_f64($X)
    - pattern: $D.div_f32($X)
