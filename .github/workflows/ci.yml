name: ci

# Diagnostic branch, not for merge: times `http_stream_survives_cache_ceiling` on the Linux runner,
# on the current stack (`new`) and on the stack before the 2026-11-21 push (`base`).
on:
  pull_request:

env:
  PEARTUBE_APP: ${{ github.workspace }}/peartube

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        stack: [new, base]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: diag-src
      - name: Stack sources
        run: |
          set -eu
          owner=${{ github.repository_owner }}
          get() {
            git clone -q "https://github.com/$owner/$1" "$1"
            git -C "$1" checkout -q "$2"
            echo "$1 $(git -C "$1" rev-parse --short HEAD)"
          }
          if [ "${{ matrix.stack }}" = base ]; then
            get peartube-native 38ce637
            while read -r repo sha; do get "$repo" "$sha"; done < diag-src/diag/base.lock
          else
            get peartube-native 33196e5
            while read -r repo _; do get "$repo" main; done < diag-src/diag/base.lock
          fi
          get mdns-sd peartube
          get peartube "$(cat peartube-native/JS_REF)"
          cp diag-src/tests/blobs.rs peartube-native/tests/blobs.rs
          nproc
          grep -m1 'model name' /proc/cpuinfo
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: peartube
      - run: npm ci --no-audit --no-fund
        working-directory: peartube-native/tests/js
      - run: sudo apt-get install -y -qq gdb
      - name: Timing, no debugger
        working-directory: peartube-native
        run: DIAG_GDB=0 DIAG_TAIL=60 DIAG_OUT=/tmp/diag-a sh ../diag-src/diag/run.sh ../diag-src/diag
      - name: Timing, with stack samples
        working-directory: peartube-native
        run: DIAG_TAIL=20 DIAG_OUT=/tmp/diag-b sh ../diag-src/diag/run.sh ../diag-src/diag sudo
