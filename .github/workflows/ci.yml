name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The app commit in JS_REF is the reference for every fixture and every ignored interop test.
env:
  PEARTUBE_APP: ${{ github.workspace }}/peartube
  # Tests keep debug assertions and overflow checks. CI does not use a debugger.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.select.outputs.scope }}
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: select
        name: Select tests for the merge result
        shell: python
        run: |
          import os, re, subprocess
          from pathlib import Path

          scope, targets = "full", []
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              # Compare the tree that CI will test with its base parent. No API file limit.
              diff = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", "HEAD^1", "HEAD"])
              paths = [os.fsdecode(p) for p in diff.split(b"\0") if p]
              full = ("src/", "fixtures/", "tests/js/", "tests/support/", ".github/workflows/")
              if paths and all(p.endswith(".md") and not p.startswith(full) for p in paths):
                  # src/lib.rs includes README.md. It must still exist after a prose-only change.
                  if not Path("README.md").is_file():
                      raise SystemExit("Missing README.md, which src/lib.rs includes.")
                  if "README.md" not in paths or "0 tests, 0 benchmarks" in subprocess.check_output(
                      ["rustdoc", "--test", "README.md", "--test-args=--list"], text=True
                  ).splitlines():
                      scope = "docs"
              elif paths and all(re.fullmatch(r"tests/[A-Za-z_][A-Za-z_0-9]*\.rs", p)
                                 and Path(p).is_file() and not Path(p).is_symlink() for p in paths):
                  scope, targets = "targets", [Path(p).stem for p in paths]
          print("Test scope:", scope, *targets)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("scope=" + scope, "targets=" + " ".join(targets), sep="\n", file=out)

  rust:
    name: ${{ matrix.check }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.scope != 'docs'
    strategy:
      # One OS failing must not hide the other's result.
      fail-fast: false
      # Known failures, each recorded in PARITY.md (`src/lan.js` row): bonjour-service does not see the Rust
      # record in `mdns_interop_with_bonjour_service` (also on Linux, where JS/Rust LAN discovery itself passes),
      # and macOS runners deliver no LAN multicast, so every test that discovers a peer over mDNS fails there.
      matrix:
        # Create the longest cold job first. All jobs remain eligible to run at once.
        check: ${{ fromJSON(needs.changes.outputs.scope == 'full' && '["test","interop","transfers","clippy"]' || '["test","clippy"]') }}
        os: [macos-latest, ubuntu-latest]
        include:
          - os: ubuntu-latest
            skip: --skip mdns_interop_with_bonjour_service
          - os: macos-latest
            skip: --skip mdns_interop_with_bonjour_service --skip over_the_lan --skip over_lan --skip lan_token_gating_and_dial_order
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: peartube-native
    steps:
      - uses: actions/checkout@v4
        with:
          path: peartube-native
      - id: jsref
        run: echo "ref=$(cat JS_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/peartube
          ref: ${{ steps.jsref.outputs.ref }}
          path: peartube
      - name: Check out and verify the pinned sibling commits
        shell: python
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          import os, re, subprocess
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path

          expected = set("""compact-encoding-rs protomux-rs protomux-wakeup-rs hyperschema-rs
              hypercore-id-encoding-rs hypercore-storage-rs hypercore-rs corestore-rs hyperbee-rs
              hyperblobs-rs byte-stream-rs autobee-rs peeroxide mdns-sd""".split())
          pins = {}
          for line in Path("STACK.lock").read_text().splitlines():
              name, sha = line.split()
              if name not in expected or name in pins or not re.fullmatch("[0-9a-f]{40}", sha):
                  raise SystemExit(f"Invalid or duplicate STACK.lock entry: {name!r}")
              pins[name] = sha
          if expected != pins.keys():
              raise SystemExit(f"Missing pins: {sorted(expected - pins.keys())}")

          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          def checkout(pin):
              name, sha = pin
              dest = Path("..") / name
              url = f"{os.environ['GITHUB_SERVER_URL']}/{owner}/{name}.git"
              subprocess.run(["git", "clone", "--quiet", "--no-tags", "--depth=1",
                              f"--revision={sha}", url, dest], check=True)
              head = subprocess.check_output(["git", "-C", dest, "rev-parse", "HEAD"], text=True).strip()
              if head != sha:
                  raise SystemExit(f"{name}: expected {sha}, checked out {head}")
              return f"ok   {name} {head}"

          # Fetch only the public repos named above, without sharing credentials or a working tree.
          with ThreadPoolExecutor(max_workers=4) as pool:
              for verified in pool.map(checkout, pins.items()):
                  print(verified)
          extra = {p.name for p in Path("..").iterdir() if p.is_dir()} - expected - {"peartube", "peartube-native"}
          if extra:
              raise SystemExit(f"Unexpected checkout directories: {sorted(extra)}")
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Fresh checkouts otherwise make Cargo rebuild unchanged path dependencies.
      # Both cache keys (restore and save) include STACK.lock, even if a pin moves back.
      - name: Use the pinned commit time for sibling build inputs
        run: |
          export TZ=UTC
          for dir in ../*/; do
            case "${dir#../}" in peartube-native/|peartube/) continue ;; esac
            stamp=$(git -C "$dir" show -s --format=%cd --date=format-local:%Y%m%d%H%M.%S HEAD)
            find "$dir" -name .git -prune -o -exec touch -h -t "$stamp" {} +
          done
      # Cargo builds the pinned siblings in this workspace's target directory.
      # The action also keys on OS, architecture and rustc, and omits this workspace's binaries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: peartube-native
          # Only the general test job writes the cache that the other test jobs read.
          key: ${{ matrix.check == 'clippy' && 'clippy' || 'test' }}-${{ hashFiles('peartube-native/Cargo.lock', 'peartube-native/STACK.lock') }}
          save-if: ${{ matrix.check == 'test' || matrix.check == 'clippy' }}
          cache-bin: false
      - run: cargo fmt --check -p peartube-native -p peartube-native-ffi
        if: matrix.check == 'clippy'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: matrix.check == 'clippy'
      - id: suite
        name: Check which targets read the changed files
        env:
          CHECK: ${{ matrix.check }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          TARGETS: ${{ needs.changes.outputs.targets }}
        shell: python
        run: |
          import os, re
          from functools import cache
          from pathlib import Path

          check = os.environ["CHECK"]
          scope = {"test": os.environ["SCOPE"], "clippy": "none"}.get(check, check)
          if os.environ["CHECK"] == "clippy" and os.environ["SCOPE"] == "targets":
              # Clippy checks all targets. Read rustc's input lists, not a map of source files.
              # If a different target includes a changed file, run the full suite on this runner.
              names = set(os.environ["TARGETS"].split())
              sources = {(Path("tests") / (n + ".rs")).resolve(): n for n in names}
              @cache
              def consumer_input(token):
                  return sources.get(Path(os.fsdecode(token)).resolve())
              seen = set()
              for dep in Path("target/debug").rglob("*.d"):
                  with dep.open("rb") as f:
                      inputs = re.findall(rb"(?:\\.|[^\s\\])+", f.readline().partition(b": ")[2])
                  for i, token in enumerate(inputs):
                      name = consumer_input(re.sub(rb"\\(.)", rb"\1", token))
                      if name is None:
                          continue
                      seen.add(name)
                      if i != 0 or not re.fullmatch(re.escape(name) + r"(?:-[0-9a-f]+)?", dep.stem):
                          print(f"{dep} also reads tests/{name}.rs")
                          scope = "full"
              if seen != names:
                  print("Could not verify the consumers of:", *sorted(names - seen))
                  scope = "full"
          print("Suite on this runner:", scope)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("scope=" + scope, file=out)
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        if: steps.suite.outputs.scope != 'none'
        with:
          tool: nextest@0.9.152
          fallback: none
      - uses: actions/setup-node@v4
        if: steps.suite.outputs.scope != 'none'
        with:
          node-version: 22
      # The app imports its own bare/holepunch libraries, so its checkout needs its dependencies.
      - run: npm ci --no-audit --no-fund
        if: steps.suite.outputs.scope != 'none'
        working-directory: peartube
      # The interop harnesses import Protomux, compact-encoding and Bonjour themselves.
      - run: npm ci --no-audit --no-fund
        if: steps.suite.outputs.scope != 'none'
        working-directory: peartube-native/tests/js
      # Fails when a committed reference is not what the app at JS_REF produces.
      - run: node fixtures/gen/check.mjs
        if: steps.suite.outputs.scope != 'none'
      # Unfiltered cargo test also links examples whose test flag is false.
      - name: Link workspace examples
        if: steps.suite.outputs.scope == 'transfers' || (matrix.check == 'clippy' && steps.suite.outputs.scope == 'full')
        shell: bash
        run: |
          cargo build --workspace --examples --profile test --message-format=json-render-diagnostics |
            jq -r 'select(.reason == "compiler-artifact" and .target.kind == ["example"] and .executable != null) | "Linked example: \(.target.name)"'
      - id: tests
        name: Run Rust tests, including ignored interop tests
        if: steps.suite.outputs.scope != 'none'
        shell: python
        env:
          CHECK: ${{ matrix.check }}
          SCOPE: ${{ steps.suite.outputs.scope }}
          TARGETS: ${{ needs.changes.outputs.targets }}
          SKIP: ${{ matrix.skip }}
        run: |
          import json, os, subprocess

          check, scope = os.environ["CHECK"], os.environ["SCOPE"]
          args = ["--workspace"]
          if scope == "targets":
              args = ["-p", "peartube-native"]
              for name in os.environ["TARGETS"].split():
                  args.extend(["--test", name])
          elif check != "clippy":
              # All three runners together run every test. A new target stays in the general job.
              # Assign heavy binaries before Cargo compiles them, not only when nextest runs them.
              groups = {
                  "transfers": {"peartube-native::blobs"},
                  "interop": {"peartube-native-ffi::abi"} | {"peartube-native::" + n for n in (
                      "node_mixed", "network_mixed_a", "network_mixed_b", "network_mixed_c",
                      "search_mixed", "soulseek_provider")},
              }
              meta = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version=1"]))
              flags, moved = set(), set()
              for package in meta["packages"]:
                  for target in package["targets"]:
                      if not target["test"]:
                          continue
                      kind, name = target["kind"], target["name"]
                      binary = f"{package['name']}::{name}"
                      owner = next((job for job, ids in groups.items() if kind == ["test"] and binary in ids), "test")
                      if owner != "test" and (owner == check or check == "test"):
                          moved.add(f"binary_id(={binary})")
                      if owner != check:
                          continue
                      if kind in (["bin"], ["test"], ["example"], ["bench"]):
                          flags.add(("--" + kind[0], name))
                      elif set(kind) <= {"lib", "rlib", "dylib", "cdylib", "staticlib", "proc-macro"}:
                          flags.add(("--lib",))
                      else:
                          flags.add(())  # Unknown target kind: build Cargo's defaults and filter execution.
              if () not in flags:
                  for flag in sorted(flags):
                      args.extend(flag)
              expr = "|".join(sorted(moved)) or "none()"
              args.extend(["-E", f"not({expr})" if check == "test" else expr])
          os.execvp("cargo", ["cargo", "nextest", "run", "--profile", "ci", *args,
                              "--run-ignored", "all", "--no-fail-fast", "--", *os.environ["SKIP"].split()])
      # nextest does not run doctests. Run them here on full changes, including clippy's full fallback.
      - run: cargo test --workspace --doc --no-fail-fast -- --include-ignored ${{ matrix.skip }}
        if: >-
          !cancelled() && (steps.suite.outputs.scope == 'transfers' ||
          (matrix.check == 'clippy' && steps.suite.outputs.scope == 'full')) &&
          (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')

  result:
    name: CI result
    needs: [changes, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to pass
        env:
          PLAN: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          RUST: ${{ needs.rust.result }}
        run: |
          test "$PLAN" = success
          case "$SCOPE:$RUST" in
            docs:skipped|targets:success|full:success) echo "Passed: $SCOPE" ;;
            *) echo "::error::Unexpected CI result: $SCOPE:$RUST"; exit 1 ;;
          esac
