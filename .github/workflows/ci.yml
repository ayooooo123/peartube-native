name: ci

on:
  push:
    branches: [main]
  pull_request:

# The app commit in JS_REF is the reference for every fixture and every ignored interop test.
env:
  PEARTUBE_APP: ${{ github.workspace }}/peartube

jobs:
  rust:
    strategy:
      # One OS failing must not hide the other's result.
      fail-fast: false
      # Known failures, each recorded in PARITY.md (`src/lan.js` row): bonjour-service does not see the Rust
      # record in `mdns_interop_with_bonjour_service` (also on Linux, where JS/Rust LAN discovery itself passes),
      # and macOS runners deliver no LAN multicast, so every test that discovers a peer over mDNS fails there.
      matrix:
        include:
          - os: ubuntu-latest
            skip: --skip mdns_interop_with_bonjour_service
          - os: macos-latest
            skip: --skip mdns_interop_with_bonjour_service --skip over_the_lan --skip over_lan --skip lan_token_gating_and_dial_order
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: peartube-native
    steps:
      - uses: actions/checkout@v4
        with:
          path: peartube-native
      - id: jsref
        run: echo "ref=$(cat JS_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/peartube
          ref: ${{ steps.jsref.outputs.ref }}
          path: peartube
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/compact-encoding-rs
          path: compact-encoding-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/protomux-rs
          path: protomux-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/protomux-wakeup-rs
          path: protomux-wakeup-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hyperschema-rs
          path: hyperschema-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hypercore-id-encoding-rs
          path: hypercore-id-encoding-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hypercore-storage-rs
          path: hypercore-storage-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hypercore-rs
          path: hypercore-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/corestore-rs
          path: corestore-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hyperbee-rs
          path: hyperbee-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hyperblobs-rs
          path: hyperblobs-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/byte-stream-rs
          path: byte-stream-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/autobee-rs
          path: autobee-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/peeroxide
          path: peeroxide
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The app imports its own bare/holepunch libraries, so its checkout needs its dependencies.
      - run: npm ci --no-audit --no-fund
        working-directory: peartube
      # The interop harnesses import Protomux, compact-encoding and Bonjour themselves.
      - run: npm ci --no-audit --no-fund
        working-directory: peartube-native/tests/js
      # Fails when a committed reference is not what the app at JS_REF produces.
      - run: node fixtures/gen/check.mjs
      - run: cargo fmt --check -p peartube-native -p peartube-native-ffi
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The ignored tests drive the app's own JS: they run here, against the JS_REF checkout.
      - run: cargo test --workspace --no-fail-fast -- --include-ignored --test-threads=1 ${{ matrix.skip }}
