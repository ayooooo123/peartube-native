name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The app commit in JS_REF is the reference for every fixture and every ignored interop test.
env:
  PEARTUBE_APP: ${{ github.workspace }}/peartube
  # Tests keep debug assertions and overflow checks. CI does not use a debugger.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.select.outputs.scope }}
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: select
        name: Select tests for the merge result
        shell: python
        run: |
          import os, re, subprocess
          from pathlib import Path

          scope, targets = "full", []
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              # Compare the tree that CI will test with its base parent. No API file limit.
              diff = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", "HEAD^1", "HEAD"])
              paths = [os.fsdecode(p) for p in diff.split(b"\0") if p]
              full = ("src/", "fixtures/", "tests/js/", "tests/support/", ".github/workflows/")
              if paths and all(p.endswith(".md") and not p.startswith(full) for p in paths):
                  # The crate includes README.md. A deletion or a Rust example is not prose only.
                  if "README.md" not in paths or (
                      Path("README.md").is_file() and
                      "0 tests, 0 benchmarks" in subprocess.check_output(
                          ["rustdoc", "--test", "README.md", "--test-args=--list"], text=True
                      ).splitlines()
                  ):
                      scope = "docs"
              elif paths and all(re.fullmatch(r"tests/[A-Za-z_][A-Za-z_0-9]*\.rs", p)
                                 and Path(p).is_file() and not Path(p).is_symlink() for p in paths):
                  scope, targets = "targets", [Path(p).stem for p in paths]
          print("Test scope:", scope, *targets)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("scope=" + scope, "targets=" + " ".join(targets), sep="\n", file=out)

  rust:
    name: ${{ matrix.check }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.scope != 'docs'
    strategy:
      # One OS failing must not hide the other's result.
      fail-fast: false
      # Known failures, each recorded in PARITY.md (`src/lan.js` row): bonjour-service does not see the Rust
      # record in `mdns_interop_with_bonjour_service` (also on Linux, where JS/Rust LAN discovery itself passes),
      # and macOS runners deliver no LAN multicast, so every test that discovers a peer over mDNS fails there.
      matrix:
        os: [ubuntu-latest, macos-latest]
        check: ${{ fromJSON(needs.changes.outputs.scope == 'full' && '["clippy","test","transfers"]' || '["clippy","test"]') }}
        include:
          - os: ubuntu-latest
            skip: --skip mdns_interop_with_bonjour_service
          - os: macos-latest
            skip: --skip mdns_interop_with_bonjour_service --skip over_the_lan --skip over_lan --skip lan_token_gating_and_dial_order
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: peartube-native
    steps:
      - uses: actions/checkout@v4
        with:
          path: peartube-native
      - id: jsref
        run: echo "ref=$(cat JS_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/peartube
          ref: ${{ steps.jsref.outputs.ref }}
          path: peartube
      # The sibling crates build at the commits STACK.lock names, as release-ffi.yml does: a red run
      # then comes from this repo's change, and a sibling change is tested here once the lock names it.
      - id: stack
        run: while read -r repo sha; do echo "$repo=$sha" >> "$GITHUB_OUTPUT"; done < STACK.lock
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/compact-encoding-rs
          ref: ${{ steps.stack.outputs['compact-encoding-rs'] }}
          path: compact-encoding-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/protomux-rs
          ref: ${{ steps.stack.outputs['protomux-rs'] }}
          path: protomux-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/protomux-wakeup-rs
          ref: ${{ steps.stack.outputs['protomux-wakeup-rs'] }}
          path: protomux-wakeup-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hyperschema-rs
          ref: ${{ steps.stack.outputs['hyperschema-rs'] }}
          path: hyperschema-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hypercore-id-encoding-rs
          ref: ${{ steps.stack.outputs['hypercore-id-encoding-rs'] }}
          path: hypercore-id-encoding-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hypercore-storage-rs
          ref: ${{ steps.stack.outputs['hypercore-storage-rs'] }}
          path: hypercore-storage-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hypercore-rs
          ref: ${{ steps.stack.outputs['hypercore-rs'] }}
          path: hypercore-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/corestore-rs
          ref: ${{ steps.stack.outputs['corestore-rs'] }}
          path: corestore-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hyperbee-rs
          ref: ${{ steps.stack.outputs['hyperbee-rs'] }}
          path: hyperbee-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hyperblobs-rs
          ref: ${{ steps.stack.outputs['hyperblobs-rs'] }}
          path: hyperblobs-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/byte-stream-rs
          ref: ${{ steps.stack.outputs['byte-stream-rs'] }}
          path: byte-stream-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/autobee-rs
          ref: ${{ steps.stack.outputs['autobee-rs'] }}
          path: autobee-rs
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/peeroxide
          ref: ${{ steps.stack.outputs['peeroxide'] }}
          path: peeroxide
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mdns-sd
          ref: ${{ steps.stack.outputs['mdns-sd'] }}
          path: mdns-sd
      # A sibling missing from STACK.lock would check out its default branch without a word: fail instead.
      - name: Siblings are at their STACK.lock commits
        run: |
          bad=0
          while read -r repo sha; do
            head=$(git -C "../$repo" rev-parse HEAD)
            if [ "$head" = "$sha" ]; then echo "ok   $repo $head"; else echo "DIFF $repo is at $head, STACK.lock names $sha"; bad=1; fi
          done < STACK.lock
          for dir in ../*/; do
            repo=$(basename "$dir")
            case "$repo" in peartube-native|peartube) continue ;; esac
            grep -q "^$repo " STACK.lock || { echo "DIFF $repo is checked out but STACK.lock does not name it"; bad=1; }
          done
          exit $bad
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Fresh checkouts otherwise make Cargo rebuild unchanged path dependencies.
      # Both cache keys (restore and save) include STACK.lock, even if a pin moves back.
      - name: Use the pinned commit time for sibling build inputs
        run: |
          export TZ=UTC
          for dir in ../*/; do
            case "${dir#../}" in peartube-native/|peartube/) continue ;; esac
            stamp=$(git -C "$dir" show -s --format=%cd --date=format-local:%Y%m%d%H%M.%S HEAD)
            find "$dir" -name .git -prune -o -exec touch -h -t "$stamp" {} +
          done
      # Cargo builds the pinned siblings in this workspace's target directory.
      # The action also keys on OS, architecture and rustc, and omits this workspace's binaries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: peartube-native
          # The transfer tests can read the full test cache, but must not save a partial one.
          key: ${{ matrix.check == 'clippy' && 'clippy' || 'test' }}-${{ hashFiles('peartube-native/Cargo.lock', 'peartube-native/STACK.lock') }}
          save-if: ${{ matrix.check != 'transfers' }}
          cache-bin: false
      - name: Trace real compiler calls, including the C host's child Cargo
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/ci-compile-trace"
          mkdir "$bin"
          : > "$bin/compilers"
          : > "$bin/ffi-child"
          cat > "$bin/rustc-wrapper" <<'SH'
          #!/bin/sh
          case " $* " in
            *" --emit="*|*" --emit "*)
              printf '%s\t%s\t%s\n' "${CI_TRACE_PARENT:-outer}" "${CARGO_MANIFEST_DIR:-unknown}" \
                "${CARGO_PKG_NAME:-unknown}" >> "$RUNNER_TEMP/ci-compile-trace/compilers"
              ;;
          esac
          exec "$@"
          SH
          cat > "$bin/cargo" <<'SH'
          #!/bin/sh
          if [ "$*" = "build -p peartube-native-ffi --lib" ]; then
            printf '%s\n' "$RUSTC_WRAPPER" >> "$RUNNER_TEMP/ci-compile-trace/ffi-child"
            export CI_TRACE_PARENT=ffi-child
          fi
          exec "$CI_TRACE_CARGO" "$@"
          SH
          chmod +x "$bin/rustc-wrapper" "$bin/cargo"
          printf 'CI_TRACE_CARGO=%s\nCARGO=%s/cargo\nRUSTC_WRAPPER=%s/rustc-wrapper\n' \
            "$(command -v cargo)" "$bin" "$bin" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"
      - run: cargo fmt --check -p peartube-native -p peartube-native-ffi
        if: matrix.check == 'clippy'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: matrix.check == 'clippy'
      - id: suite
        name: Check which targets read the changed files
        env:
          CHECK: ${{ matrix.check }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          TARGETS: ${{ needs.changes.outputs.targets }}
        shell: python
        run: |
          import os, re
          from functools import cache
          from pathlib import Path

          scope = {"test": os.environ["SCOPE"], "transfers": "transfers", "clippy": "none"}[os.environ["CHECK"]]
          if os.environ["CHECK"] == "clippy" and os.environ["SCOPE"] == "targets":
              # Clippy checks all targets. Read rustc's input lists, not a map of source files.
              # If a different target includes a changed file, run the full suite on this runner.
              names = set(os.environ["TARGETS"].split())
              sources = {(Path("tests") / (n + ".rs")).resolve(): n for n in names}
              @cache
              def consumer_input(token):
                  return sources.get(Path(os.fsdecode(token)).resolve())
              seen = set()
              for dep in Path("target/debug").rglob("*.d"):
                  with dep.open("rb") as f:
                      inputs = re.findall(rb"(?:\\.|[^\s\\])+", f.readline().partition(b": ")[2])
                  for i, token in enumerate(inputs):
                      name = consumer_input(re.sub(rb"\\(.)", rb"\1", token))
                      if name is None:
                          continue
                      seen.add(name)
                      if i != 0 or not re.fullmatch(re.escape(name) + r"(?:-[0-9a-f]+)?", dep.stem):
                          print(f"{dep} also reads tests/{name}.rs")
                          scope = "full"
              if seen != names:
                  print("Could not verify the consumers of:", *sorted(names - seen))
                  scope = "full"
          print("Suite on this runner:", scope)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("scope=" + scope, file=out)
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        if: steps.suite.outputs.scope != 'none'
        with:
          tool: nextest@0.9.152
          fallback: none
      - uses: actions/setup-node@v4
        if: steps.suite.outputs.scope != 'none'
        with:
          node-version: 22
      # The app imports its own bare/holepunch libraries, so its checkout needs its dependencies.
      - run: npm ci --no-audit --no-fund
        if: steps.suite.outputs.scope != 'none'
        working-directory: peartube
      # The interop harnesses import Protomux, compact-encoding and Bonjour themselves.
      - run: npm ci --no-audit --no-fund
        if: steps.suite.outputs.scope != 'none'
        working-directory: peartube-native/tests/js
      # Fails when a committed reference is not what the app at JS_REF produces.
      - run: node fixtures/gen/check.mjs
        if: steps.suite.outputs.scope != 'none'
      - id: tests
        name: Run Rust tests, including ignored interop tests
        if: steps.suite.outputs.scope != 'none'
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
          SCOPE: ${{ steps.suite.outputs.scope }}
          TARGETS: ${{ needs.changes.outputs.targets }}
        run: |
          args=(--workspace)
          transfers=(blobs network_mixed_c)
          if [[ "$SCOPE" == targets ]]; then
            args=(-p peartube-native)
            for target in $TARGETS; do args+=(--test "$target"); done
          elif [[ "$SCOPE" == transfers ]]; then
            args=(-p peartube-native)
            for target in "${transfers[@]}"; do args+=(--test "$target"); done
          elif [[ "$CHECK" == test ]]; then
            # Every other binary, including any future binary, stays in the main job.
            selectors=()
            for target in "${transfers[@]}"; do selectors+=("binary_id(=peartube-native::$target)"); done
            excluded=$(IFS='|'; echo "${selectors[*]}")
            args+=(-E "not($excluded)")
          fi
          cargo nextest run --profile ci "${args[@]}" --run-ignored all --no-fail-fast -- ${{ matrix.skip }}
      # nextest does not run doctests. Keep both crates' doctests even if a Rust test failed.
      - run: cargo test --workspace --doc --no-fail-fast -- --include-ignored ${{ matrix.skip }}
        if: >-
          !cancelled() && steps.suite.outputs.scope == 'full' &&
          (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
      - name: Count sibling compiler calls before the separate diagnostics
        if: "!cancelled()"
        shell: python
        env:
          CHECK: ${{ matrix.check }}
        run: |
          import json, os
          from collections import Counter
          from pathlib import Path
          trace = Path(os.environ["RUNNER_TEMP"]) / "ci-compile-trace"
          bins = {name: (Path("..") / name).resolve() for name, sha in
                  (line.split() for line in Path("STACK.lock").read_text().splitlines())}
          crates = Counter()
          workspace = Path.cwd().resolve()
          home = Path(os.environ.get("CARGO_HOME", Path.home() / ".cargo")).resolve()
          for line in (trace / "compilers").read_text().splitlines():
              parent, path, crate = line.split("\t")
              assert path != "unknown" and crate != "unknown", line
              loc = Path(path).resolve()
              if loc.is_relative_to(workspace):
                  group = "workspace"
              elif loc.is_relative_to(home):
                  group = "external"
              else:
                  group = next((n for n, root in bins.items() if loc.is_relative_to(root)), None)
                  assert group is not None, line
              crates[parent, group, crate] += 1
          children = (trace / "ffi-child").read_text().splitlines()
          siblings = sum(n for (parent, group, crate), n in crates.items() if group in bins)
          counts = {":".join(k): v for k, v in sorted(crates.items())}
          print("COMPILE_TRACE", json.dumps({"ffi_children": len(children), "siblings": siblings, "counts": counts}))
          assert any(g == "workspace" and c == "peartube-native" for _, g, c in crates), counts
          assert len(children) == int(os.environ["CHECK"] == "test"), children
          assert all(p == str(trace / "rustc-wrapper") for p in children), children
          assert siblings == 0, counts
      - name: Repeat the failed case without another test on this runner
        if: >-
          !cancelled() &&
          (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') &&
          ((matrix.check == 'test' && runner.os == 'Linux') ||
           (matrix.check == 'transfers' && runner.os == 'macOS'))
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          if [[ "$CHECK" == test ]]; then
            target=acquire_mirror
            name=library::the_library_matches_the_app
            samples=20
          else
            target=network_mixed_c
            name=rust_viewer_clear_cache_shrinks_the_disk_immediately
            samples=12
          fi
          for ((i=1; i<=samples; i++)); do
            printf 'Isolation sample %d/%d: %s\n' "$i" "$samples" "$name"
            cargo nextest run --profile ci -p peartube-native --test "$target" \
              -E "test(=$name)" --test-threads 1 --run-ignored all
          done
      - name: Hold one watch scan in put and observe the other
        if: >-
          !cancelled() && matrix.check == 'test' && runner.os == 'Linux' &&
          (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/watch-gate.XXXXXX")
          probe="$work/peartube-native"
          mkdir "$probe"
          git archive HEAD | tar -xf - -C "$probe"
          for dir in "$GITHUB_WORKSPACE"/*; do
            if [[ -d "$dir" && "${dir##*/}" != peartube-native ]]; then ln -s "$dir" "$work/"; fi
          done
          # This separate executable reuses the real fake node. Do not change the fixture.
          cat tests/acquire_mirror.rs - > "$probe/tests/watch_gate_probe.rs" <<'RS'

          #[tokio::test]
          async fn ci_controlled_watch_overlap() {
              use peartube_native::mirror::{LocalMirrorFiles, MirrorHost, MirrorOptions};
              let root = tempfile::tempdir().unwrap();
              let import = root.path().join("import");
              let storage = root.path().join("storage");
              std::fs::create_dir(&import).unwrap();
              std::fs::create_dir(&storage).unwrap();
              let node = FakeNode::new();
              let host = MirrorHost::start(
                  node.clone(), None, Arc::new(LocalMirrorFiles), Arc::new(Factory),
                  Arc::new(RechunkFactory), Feeds::new(), Vec::new(),
                  MirrorOptions {
                      storage: storage.display().to_string(),
                      watch_dir: Some(import.display().to_string()),
                      mirror_channel: false, poll_interval_ms: 0, ..Default::default()
                  },
              ).await;
              host.wait_idle().await;
              std::fs::write(import.join("Late.mkv"), b"late").unwrap();
              let gate = Arc::new(tokio::sync::Semaphore::new(0));
              *node.put_gate.lock().unwrap() = Some(gate.clone());
              let first = host.run("watch-dir", Value::Null);
              let overlap = async {
                  until(|| node.calls.lock().unwrap().iter().any(|c| c["method"] == "put")).await;
                  let second = host.run("watch-dir", Value::Null).await.unwrap();
                  gate.add_permits(1);
                  second
              };
              let (first, second) = tokio::time::timeout(
                  Duration::from_secs(10), futures_util::future::join(first, overlap),
              ).await.expect("both scans completed after the gate opened");
              let first = first.unwrap();
              let after = host.run("watch-dir", Value::Null).await.unwrap();
              println!("first={first} while_held={second} after_release={after}");
              assert_eq!(first["ingested"], 1);
              assert_eq!(second, json!({"scanned": 0, "ingested": 0, "busy": true, "items": []}));
              assert_eq!(after["scanned"], 1);
              assert!(after.get("busy").is_none());
              host.close().await;
          }
          RS
          CARGO_TARGET_DIR="$PWD/target" cargo test --locked --manifest-path "$probe/Cargo.toml" \
            -p peartube-native --test watch_gate_probe -- ci_controlled_watch_overlap --exact --nocapture \
            | tee "$work/result"
          grep -F ' while_held=' "$work/result"

  result:
    name: CI result
    needs: [changes, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to pass
        env:
          PLAN: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          RUST: ${{ needs.rust.result }}
        run: |
          test "$PLAN" = success
          case "$SCOPE:$RUST" in
            docs:skipped|targets:success|full:success) echo "Passed: $SCOPE" ;;
            *) echo "::error::Unexpected CI result: $SCOPE:$RUST"; exit 1 ;;
          esac
