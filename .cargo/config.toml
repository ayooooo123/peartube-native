# RocksDB's portable build checks every blob read's CRC32C in software (about 9 % of
# a Linux seeder's CPU); SSE4.2 + CLMUL select its hardware path. Every x86-64 CPU
# since Westmere (2010) has both.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2", "-C", "target-feature=+pclmulqdq"]

# chacha20 0.9 uses its NEON backend only when asked; otherwise every peer connection's
# cipher runs as portable scalar code. NEON is part of every aarch64 target built here.
# ffi/build.sh sets its own flags and repeats this one.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "chacha20_force_neon"]
